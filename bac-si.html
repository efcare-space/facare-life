<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FaCare Life · Bác sĩ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#233A77">
<link rel="manifest" href="manifest-bac-si.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="chung.css?v=0.4.0">
<script>window.EFC_URL='https://efc-may-chu.efcare.workers.dev';window.EFL_URL='https://efl-may-chu.efcare.workers.dev';</script>
<script src="chung.js?v=0.4.0"></script>
<style>.nhan.navy{background:var(--navy);color:#fff}.khach-the{cursor:pointer}.khach-the:hover{border-color:var(--xanh)}.chi-so{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}</style>
</head><body>
<div id="thu" class="thu an">Kho thử · dữ liệu giả</div>
<section id="manDN" class="vung an" style="max-width:440px">
  <div style="text-align:center;margin:28px 0 14px"><span id="lg" style="width:52px;height:52px;display:inline-block"></span>
    <div class="chu-logo" style="font-size:34px;margin-top:8px"><span class="fa">FaCare</span> <span class="li">Life</span></div><p class="mo" style="margin-top:6px"><span class="nhan navy">Bác sĩ</span></p></div>
  <div class="the"><h2>Đăng nhập tài khoản EFCARE</h2><label for="s">Số điện thoại</label><input id="s" inputmode="tel"><label for="p">Mã PIN (6 số)</label><input id="p" type="password" inputmode="numeric" maxlength="6">
    <div id="dnB"></div><button class="nut navy rong" id="dnN" style="margin-top:12px">Đăng nhập</button></div>
</section>
<header class="dau an" id="dau"><div class="logo"><span class="o-logo" id="lg2"></span><span class="chu-logo"><span class="fa">FaCare</span> <span class="li">Life</span></span></div>
  <div class="phai"><span class="nhan navy">Bác sĩ</span><a class="nut phu nho" href="index.html">App</a></div></header>
<main class="vung an" id="nd"></main>
<nav class="duoi an" id="duoi"></nav>
<script>
const F = window.FL, $ = (i) => document.getElementById(i), E = F.esc;
if (F.THU) $('thu').classList.remove('an'); $('lg').innerHTML = F.logo; $('lg2').innerHTML = F.logo;
let TOI = null, D = null, TAB = 'theo-doi';
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const TABS = [['theo-doi', 'Theo dõi', '<path d="M3 12h4l3-8 4 16 3-8h4"/>'], ['lich', 'Lịch', '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'], ['ctv', 'Cộng tác viên', '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 11a3 3 0 1 0 0-6M21 20c0-2-1-4-3-5"/>'], ['toi', 'Tôi', '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>']];
async function lam(nut, el, fn) { if (nut) nut.disabled = true; F.bao(el, ''); try { await fn(); } catch (e) { F.bao(el, e.message); } finally { if (nut) nut.disabled = false; } }
$('dnN').onclick = () => lam($('dnN'), $('dnB'), async () => { await F.dangNhap($('s').value, $('p').value); await vao(); });
async function vao() {
  try { TOI = await F.goi('toi'); } catch (e) { return $('manDN').classList.remove('an'); }
  if (!TOI.laBacSi) { $('manDN').classList.remove('an'); return F.bao($('dnB'), `Tài khoản ${TOI.efc} chưa có vai Bác sĩ. Liên hệ Super Admin để được gán vai.`); }
  $('manDN').classList.add('an'); ['dau', 'nd', 'duoi'].forEach((i) => $(i).classList.remove('an'));
  $('duoi').innerHTML = TABS.map(([k, t, p]) => `<button data-t="${k}">${svg(p)}${t}</button>`).join('');
  $('duoi').querySelectorAll('button').forEach((b) => b.onclick = () => mo(b.dataset.t));
  mo('theo-doi');
}
async function mo(t, arg) {
  TAB = t; $('duoi').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  const nd = $('nd'); nd.innerHTML = '<p class="mo">Đang tải…</p>'; window.scrollTo(0, 0);
  try { await V[t](nd, arg); } catch (e) { if (e.canDangNhap) return location.reload(); nd.innerHTML = `<div class="bao">${E(e.message)}</div>`; }
}
const ngay = (s) => F.ngay(s);
const V = {
  async 'theo-doi'(nd) {
    D = await F.goi('bsTongQuan');
    const ut = D.khach.slice().sort((a, b) => (b.canTheoDoi - a.canTheoDoi) || (b.viecQuaHan - a.viecQuaHan));
    nd.innerHTML = `<h1>Khách được phân công</h1><p class="mo" style="margin:4px 0 12px">${D.khach.length} khách · ${D.khach.filter((x) => x.canTheoDoi).length} cần theo dõi · ${D.khach.reduce((s, x) => s + x.viecQuaHan, 0)} việc quá hạn</p>
      ${ut.map((k) => `<div class="the khach-the" data-k="${E(k.sdt)}"><div class="dong" style="border:0;padding:0"><b>${E(k.ten)}</b>${k.canTheoDoi ? '<span class="nhan vang">Cần theo dõi</span>' : ''}</div>
        <p class="mo">CTV: ${E(k.ctv || 'chưa có')}${k.maFaCare ? ' · mã FaCare ' + E(k.maFaCare) : ''}</p>
        <div class="chi-so"><span class="nhan">${k.viecMo} việc mở</span>${k.viecQuaHan ? `<span class="nhan do">${k.viecQuaHan} quá hạn</span>` : ''}<span class="nhan ${k.goiThang >= D.hanMuc.goiThang ? 'do' : 'xanh'}">Gọi ${k.goiThang}/${D.hanMuc.goiThang} tháng này</span><span class="nhan">Nhắn ${k.nhanHomNay}/${D.hanMuc.nhanNgay} hôm nay</span></div>
        <p class="mo" style="margin-top:6px">Liên hệ gần nhất: ${k.lanLienHe ? ngay(k.lanLienHe) : 'chưa có'}</p></div>`).join('') || '<div class="the"><p class="mo">Chưa có khách được phân công. Điều phối chăm sóc sẽ phân khách cho bác sĩ.</p></div>'}
      <p class="mo">Chỉ số sức khỏe của khách xem trên hệ thống FaCare (theo mã FaCare). FaCare Life không lưu thông tin y khoa.</p>`;
    nd.querySelectorAll('[data-k]').forEach((x) => x.onclick = () => mo('khach', x.dataset.k));
  },
  async khach(nd, sdt) {
    D = D || await F.goi('bsTongQuan'); const k = D.khach.find((x) => x.sdt === sdt); if (!k) return mo('theo-doi');
    const c = await F.goi('bsViecCuaKhach', sdt), hom = D.homNay;
    const TT = { moi: ['vang', 'Mới giao'], da_nhan: ['', 'CTV đã nhận'], da_lam: ['xanh', 'Đã làm'], khong_lam_duoc: ['do', 'Không làm được'] };
    nd.innerHTML = `<button class="nut phu nho" id="ve">← Danh sách</button><h1 style="margin-top:10px">${E(k.ten)}</h1>
      <p class="mo">${E(k.sdt)} · CTV ${E(k.ctv || 'chưa có')}${k.ctvSdt ? ' (' + E(k.ctvSdt) + ')' : ''}${k.maFaCare ? ' · mã FaCare <b>' + E(k.maFaCare) + '</b>' : ''}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><a class="nut navy nho" href="tel:${E(k.sdt)}">Gọi khách</a>${k.ctvSdt ? `<a class="nut phu nho" href="tel:${E(k.ctvSdt)}">Gọi CTV</a>` : ''}
        <button class="nut phu nho" id="co">${k.canTheoDoi ? 'Bỏ đánh dấu theo dõi' : 'Đánh dấu cần theo dõi'}</button></div><div id="b"></div>
      <div class="the"><h2>Giao việc cho CTV</h2><label for="gL">Loại việc</label><select id="gL">${D.loaiViec.map((x) => `<option>${E(x)}</option>`).join('')}</select>
        <div class="hai"><div><label for="gH">Hạn</label><input id="gH" type="date" value="${E(hom)}"></div><div><label class="o-chon" style="margin-top:34px"><input type="checkbox" id="gU"> Ưu tiên</label></div></div>
        <label for="gG">Ghi chú hành chính (không ghi chỉ số, chẩn đoán, thuốc)</label><input id="gG" maxlength="120" placeholder="Ví dụ: hẹn buổi sáng, gọi trước khi đến">
        <button class="nut rong" id="gN" style="margin-top:12px">Giao việc</button></div>
      <div class="the"><h2>Ghi nhật ký liên hệ</h2><div class="hai"><div><label for="lK">Kênh</label><select id="lK"><option value="goi">Gọi điện</option><option value="nhan">Nhắn tin</option></select></div><div><label for="lP">Số phút (gọi, tối đa 15)</label><input id="lP" type="number" min="0" max="15" value="10"></div></div>
        <label for="lQ">Kết quả</label><select id="lQ">${D.kqLienHe.map((x) => `<option>${E(x)}</option>`).join('')}</select>
        <button class="nut navy rong" id="lN" style="margin-top:12px">Ghi lại</button><p class="mo" style="margin-top:6px">Gói An tâm gia đình: gọi 15 phút × 4 lần/tháng, nhắn tối đa 50 tin/ngày.</p></div>
      <div class="the"><h2>Việc đã giao</h2>${c.viec.map((v) => `<div class="dong"><span>${E(v.loai)}<br><span class="mo">hạn ${ngay(v.han)} · ${E(v.ten_ctv || '')}${v.ket_qua ? ' · ' + E(v.ket_qua) : ''}${v.ghi_chu ? ' · ' + E(v.ghi_chu) : ''}</span></span><span class="nhan ${TT[v.trang_thai][0]}">${TT[v.trang_thai][1]}</span></div>`).join('') || '<p class="mo">Chưa có.</p>'}</div>
      <div class="the"><h2>Nhật ký liên hệ</h2>${c.lienHe.map((l) => `<div class="dong"><span>${l.kenh === 'goi' ? 'Gọi ' + l.phut + ' phút' : 'Nhắn tin'}<br><span class="mo">${E(String(l.luc).slice(0, 16).replace('T', ' '))}</span></span><span>${E(l.ket_qua)}</span></div>`).join('') || '<p class="mo">Chưa có.</p>'}</div>
      <div class="the"><h2>Đơn, gói của khách</h2>${c.don.map((d) => `<div class="dong"><span>${E(d.ma)}<br><span class="mo">${E(d.sp)}</span></span><span>${F.TT[d.trang_thai]}</span></div>`).join('') || '<p class="mo">Chưa có.</p>'}</div>`;
    $('ve').onclick = () => mo('theo-doi');
    $('co').onclick = () => lam($('co'), $('b'), async () => { await F.goi('bsDanhDau', sdt, !k.canTheoDoi); D = null; mo('khach', sdt); });
    $('gN').onclick = () => lam($('gN'), $('b'), async () => { await F.goi('bsGiaoViec', { khachSdt: sdt, loai: $('gL').value, han: $('gH').value, uuTien: $('gU').checked, ghiChu: $('gG').value }); D = null; mo('khach', sdt); });
    $('lN').onclick = () => lam($('lN'), $('b'), async () => { await F.goi('bsGhiLienHe', { khachSdt: sdt, kenh: $('lK').value, phut: $('lP').value, ketQua: $('lQ').value }); D = null; mo('khach', sdt); });
  },
  async lich(nd) {
    D = await F.goi('bsTongQuan'); const hom = D.homNay, nhom = {};
    D.lich.forEach((v) => { (nhom[v.han] = nhom[v.han] || []).push(v); });
    nd.innerHTML = `<h1>Lịch việc đã giao</h1><p class="mo" style="margin-bottom:12px">Việc chưa xong, theo hạn.</p>` + (Object.keys(nhom).sort().map((h) => `<div class="the"><h2>${h < hom ? '<span class="nhan do">Quá hạn</span> ' : h === hom ? '<span class="nhan xanh">Hôm nay</span> ' : ''}${ngay(h)}</h2>${nhom[h].map((v) => `<div class="dong"><span>${E(v.loai)}<br><span class="mo">${E(v.ten_khach || '')} · CTV ${E(v.ten_ctv || '')}</span></span><span class="mo">${v.trang_thai === 'moi' ? 'chưa nhận' : 'đã nhận'}</span></div>`).join('')}</div>`).join('') || '<div class="the mo">Không có việc đang mở.</div>');
  },
  async ctv(nd) {
    const ds = await F.goi('bsCtv');
    nd.innerHTML = `<h1>Cộng tác viên</h1><p class="mo" style="margin-bottom:12px">CTV đang chăm sóc khách của bác sĩ.</p>` + (ds.map((c) => { const tl = c.xong ? Math.round(c.dungHan / c.xong * 100) : 0; return `<div class="the"><div class="dong" style="border:0;padding:0"><b>${E(c.ten || c.efc)}</b>${c.sdt ? `<a class="nut phu nho" href="tel:${E(c.sdt)}">Gọi</a>` : ''}</div>
      <div class="chi-so"><span class="nhan">${c.soKhach} khách</span><span class="nhan">${c.xong}/${c.giao} việc xong</span><span class="nhan ${tl >= 80 ? 'xanh' : 'vang'}">${tl}% đúng hạn</span>${c.quaHan ? `<span class="nhan do">${c.quaHan} quá hạn</span>` : ''}</div></div>`; }).join('') || '<div class="the mo">Chưa có.</div>');
  },
  async toi(nd) {
    nd.innerHTML = `<h1>Tài khoản</h1><div class="the"><div class="dong"><span>Họ tên</span><b>${E(TOI.ten)}</b></div><div class="dong"><span>Mã EFCARE</span><b>${E(TOI.efc)}</b></div><div class="dong"><span>Vai</span><span>${TOI.tenVai.map((v) => `<span class="nhan">${E(v)}</span>`).join(' ')}</span></div></div>
      <p class="mo">Bác sĩ tư vấn trong phạm vi chứng chỉ hành nghề; không thay khám, chẩn đoán, cấp cứu 115 (QĐ03 Điều 3). App này chỉ lưu thông tin hành chính và luồng tương tác.</p>
      <button class="nut phu rong" id="out" style="margin-top:12px">Đăng xuất</button>`;
    $('out').onclick = () => { F.dangXuat(); location.reload(); };
  },
};
(async () => { if (F.phien()) await vao(); else $('manDN').classList.remove('an'); })();
</script>
</body></html>
